# Prod overrides — use with:
#   export PUBLIC_DOMAIN=your-domain.example
#   export DJANGO_SECRET_KEY=...
#   export POSTGRES_PASSWORD=...
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Do not copy a .env file for production. Supply secrets through the deployment
# environment, CI/CD secrets, or an orchestrator secret store.

x-prod-backend-env: &prod-backend-env
  DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}@postgres:5432/${POSTGRES_DB:-marketplace}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the deployment environment}
  DJANGO_DEBUG: "0"
  DEBUG: "0"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in the deployment environment}}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in the deployment environment}}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in the deployment environment}}

services:
  backend:
    environment:
      <<: *prod-backend-env
      RUN_BOOTSTRAP_TASKS: "1"
    restart: unless-stopped

  frontend:
    build:
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in the deployment environment}/api}
        VITE_WS_URL: ${VITE_WS_URL:-wss://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in the deployment environment}/ws/notifications/}
    environment: []
    restart: unless-stopped

  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    restart: unless-stopped

  redis:
    restart: unless-stopped

  celery-worker:
    environment:
      <<: *prod-backend-env
      RUN_BOOTSTRAP_TASKS: "0"
    restart: unless-stopped

  celery-beat:
    environment:
      <<: *prod-backend-env
      RUN_BOOTSTRAP_TASKS: "0"
    restart: unless-stopped
