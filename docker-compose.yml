name: construction-marketplace

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/marketplace}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-key-dev}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DEBUG: ${DJANGO_DEBUG:-1}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - media-data:/app/media
    ports:
      - "8007:8000"
    environment:
      <<: *backend-env
      RUN_BOOTSTRAP_TASKS: "1"
    depends_on:
      - postgres
      - redis
    networks:
      - marketplace-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    networks:
      - marketplace-net
    depends_on:
      - backend

  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - marketplace-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    networks:
      - marketplace-net

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["celery"]
    command: ["-A", "config", "worker", "-l", "info"]
    volumes:
      - media-data:/app/media
    environment:
      <<: *backend-env
      RUN_BOOTSTRAP_TASKS: "0"
    depends_on:
      - backend
      - redis
    networks:
      - marketplace-net

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["celery"]
    command: ["-A", "config", "beat", "-l", "info"]
    volumes:
      - media-data:/app/media
    environment:
      <<: *backend-env
      RUN_BOOTSTRAP_TASKS: "0"
    depends_on:
      - backend
      - redis
    networks:
      - marketplace-net

networks:
  marketplace-net:

volumes:
  postgres-data:
  media-data:
