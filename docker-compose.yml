
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - ./backend:/app
      - media-data:/app/media # Volume for media files
    ports:
      - "8007:8000"
    env_file:
      - .env
    environment:
      - RUN_BOOTSTRAP_TASKS=1
    depends_on:
      - postgres
      - redis
    networks:
      - marketplace-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8007/api
    networks:
      - marketplace-net
    depends_on:
      - backend

  postgres:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=marketplace
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - marketplace-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    networks:
      - marketplace-net

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - RUN_BOOTSTRAP_TASKS=0
    depends_on:
      - backend
      - redis
    networks:
      - marketplace-net

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - RUN_BOOTSTRAP_TASKS=0
    depends_on:
      - backend
      - redis
    networks:
      - marketplace-net

networks:
  marketplace-net:

volumes:
  postgres-data:
  media-data:
